      - heading "Sistema Huevos Point ERP-SaaS" [level=1] [ref=e23]
      - paragraph [ref=e24]: Huevos Point · Diseño & Desarrollo Full-Stack · 2025
    - generic [ref=e27]:
      - generic [ref=e28]: Contexto
      - paragraph [ref=e29]: Distribuidora de huevos multi-sucursal operaba sin sistema de gestión digital — ventas registradas a mano, stock desactualizado, sin trazabilidad de egresos ni visibilidad de métricas entre locales.
    - generic [ref=e30]:
      - generic [ref=e31]: Problema
      - paragraph [ref=e32]: Sin panel centralizado, el dueño no podía saber cuánto vendió cada sucursal, qué productos quedaban en stock, qué gastos tuvo el día ni detectar irregularidades. Imposible escalar ni controlar el negocio a distancia.
    - generic [ref=e33]:
      - generic [ref=e34]: Solución
      - paragraph [ref=e35]: Sistema POS web multi-tenant con ventas, stock, egresos y métricas en tiempo real desde un único panel, con cobros integrados vía MercadoPago Point.
    - generic [ref=e36]:
      - generic [ref=e37]: Resultados
      - list [ref=e38]:
        - listitem [ref=e39]: "Control operativo centralizado: todas las sucursales visibles desde un solo panel"
        - listitem [ref=e40]: Trazabilidad completa de ventas con detalle de productos, método de pago y descuentos
        - listitem [ref=e41]: Dashboard diario con ingresos, egresos y saldo neto en tiempo real
        - listitem [ref=e42]: Stock actualizado automáticamente con cada venta registrada
        - listitem [ref=e43]: Gestión de compras y cajas por sucursal con historial completo
        - listitem [ref=e44]: Cobros con terminal MercadoPago Point integrados al sistema
        - listitem [ref=e45]: Auditoría de cada acción por empleado para detectar irregularidades
        - listitem [ref=e46]: Exportación de reportes a Excel para cierre contable
        - listitem [ref=e47]: Roles diferenciados (admin / empleado) con acceso controlado por sucursal
    - generic [ref=e49]:
