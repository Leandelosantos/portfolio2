      - heading "Cecilia Brook" [level=1] [ref=e23]
      - paragraph [ref=e24]: Cecilia Brook · Diseño & Desarrollo Full-Stack · 2024
    - generic [ref=e27]:
      - generic [ref=e28]: Contexto
      - paragraph [ref=e29]: "Cecilia Brook es una artista plástica argentina de proyección internacional — expuso en Dubái, Doha, Niza y Buenos Aires, ganó premios en el Festival Internacional de Arte de Qatar y obtuvo una medalla en los International Excellence Awards en Rusia. Sin embargo, toda esa trayectoria no tenía canal digital propio: sin sitio web para mostrar su obra, compartir su historia o recibir consultas de galerías y coleccionistas."
    - generic [ref=e30]:
      - generic [ref=e31]: Problema
      - paragraph [ref=e32]: "Su obra existe en espacios físicos de primer nivel, pero online era invisible. Quien buscara \"Ceci Brook\" no encontraba nada que estuviera a la altura de lo que representa: rostros femeninos al óleo sobre alfombras persas, una propuesta visual única que merece una presencia digital igual de singular. Compartir su portfolio dependía de reenviar fotos por WhatsApp o esperar que alguien la viera en una galería."
    - generic [ref=e33]:
      - generic [ref=e34]: Solución
      - paragraph [ref=e35]: Sitio a medida en Next.js con animaciones GSAP scroll-driven y elementos 3D en Three.js, llevando la experiencia digital al mismo nivel artístico que su obra.
    - generic [ref=e36]:
      - generic [ref=e37]: Resultados
      - list [ref=e38]:
        - listitem [ref=e39]: Presencia digital profesional con identidad visual propia — a la altura de una artista que pinta en vivo en Dubái y dirige talleres en Qatar
        - listitem [ref=e40]: Su trayectoria y obra ahora tienen un hogar online que transmite el mismo nivel de su trabajo físico
    - generic [ref=e42]:
      - generic [ref=e43]: Next.js
      - generic [ref=e44]: GSAP
