        - generic [ref=e1161]:
          - paragraph [ref=e1162]: "Soy desarrollador de software y project manager con 5 años de experiencia. Mi trabajo vive en la intersección entre la lógica de negocio y la experiencia de usuario: entiendo los procesos antes de escribir una línea de código, porque creo que el mejor software no automatiza tareas, sino que transforma la forma en que las personas trabajan."
          - paragraph [ref=e1163]: "Construyo productos digitales que combinan arquitecturas sólidas con interfaces que se sienten vivas. Tengo una atracción genuina por las animaciones, el diseño 3D y las experiencias web que van más allá de lo funcional, esas que generan una reacción en quien las usa. Esa sensibilidad estética convive con criterios técnicos rigurosos: código limpio, estructuras escalables, decisiones de diseño que tienen una razón de ser."
          - paragraph [ref=e1164]: Como project manager, lidero equipos con foco en la comunicación clara, la escucha activa y la capacidad de traducir necesidades de negocio en soluciones concretas. Me adapto rápido a contextos nuevos, trabajo bien en equipo y sé cuándo liderar y cuándo escuchar. La creatividad no es un plus en mi forma de trabajar — es parte del proceso desde el primer sprint.
